name: Backend deployment validation

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  postgres-demo:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: recruitment_ci
          POSTGRES_USER: ci_user
          # Disposable CI database, exposed only on runner loopback; no production credentials.
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 127.0.0.1:55432:5432
        options: >-
          --health-cmd "pg_isready -U ci_user -d recruitment_ci"
          --health-interval 5s --health-timeout 5s --health-retries 20
    env:
      DB_URL: jdbc:postgresql://127.0.0.1:55432/recruitment_ci
      DB_USERNAME: ci_user
      DB_PASSWORD: unused-for-isolated-trust-auth-ci
      APP_FRONTEND_URL: https://demo.example.test
      CORS_ALLOWED_ORIGINS: https://demo.example.test
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
          cache-dependency-path: backend/auth-service/pom.xml
      - name: Generate isolated test secrets without logging values
        run: |
          python - <<'PY'
          import os, secrets
          with open(os.environ['GITHUB_ENV'], 'a') as output:
              output.write('JWT_SECRET=' + secrets.token_urlsafe(64) + '\n')
              for role in ('ADMIN', 'HR_MANAGER', 'HIRING_MANAGER', 'APPROVER', 'RECRUITER', 'INTERVIEWER', 'CANDIDATE'):
                  output.write('DEMO_PASSWORD_' + role + '=' + secrets.token_urlsafe(25) + 'A1!\n')
          PY
      - name: Backend tests, package and coverage
        working-directory: backend/auth-service
        run: ./mvnw -B verify
      - name: Fresh Flyway migration and repeatable demo seed on PostgreSQL
        env:
          DEMO_SEED_ENABLED: 'true'
        run: |
          bash ./seeder.sh
          bash ./seeder.sh
      - name: Real HTTP login, public API and negative RBAC
        env:
          SPRING_PROFILES_ACTIVE: prod
          DEMO_SEED_ENABLED: 'false'
        run: |
          java -jar backend/auth-service/target/auth-service-0.0.1-SNAPSHOT.jar > /tmp/recruitment-api.log 2>&1 &
          API_PID=$!
          trap 'kill "$API_PID" || true' EXIT
          python scripts/verify-demo-api.py http://127.0.0.1:8080
