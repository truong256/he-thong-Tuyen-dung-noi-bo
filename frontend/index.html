<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>HRS - Hệ thống Tuyển dụng Nội bộ</title>
  <!-- Font Awesome lấy icon vali, email, khóa, mắt ẩn/hiện -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

  <div class="login-wrapper">
    <!-- CỘT TRÁI: BANNER XANH GRADIENT -->
    <div class="hero-panel">
      <div class="hero-circle circle-1"></div>
      <div class="hero-circle circle-2"></div>

      <!-- Header: Logo HRS -->
      <div class="hero-top">
        <div class="hrs-logo-box">
          <i class="fa-solid fa-briefcase"></i>
        </div>
        <span class="hrs-brand-name">HRS</span>
      </div>

      <!-- Nội dung giới thiệu bên dưới -->
      <div class="hero-bottom">
        <div class="portal-badge">INTERNAL PORTAL</div>
        <h1 class="hero-title">Hệ thống Tuyển dụng Nội bộ</h1>
        <p class="hero-desc">
          Nền tảng quản lý quy trình, kết nối ứng viên và tối ưu hóa hiệu suất tuyển dụng dành riêng cho nhân sự của tổ chức.
        </p>
      </div>
    </div>

    <!-- CỘT PHẢI: FORM ĐĂNG NHẬP -->
    <div class="form-panel">
      <div class="form-box">
        <h2 class="auth-title">Đăng nhập</h2>
        <p class="auth-subtitle">Sử dụng email công ty để truy cập hệ thống</p>

        <!-- Khung thông báo lỗi / khóa tài khoản -->
        <div id="login-alert" class="alert-box" style="display: none;"></div>

        <form id="login-form">
          <!-- Email -->
          <div class="input-group">
            <label class="input-label">Email công ty</label>
            <div class="input-wrapper">
              <i class="fa-regular fa-envelope input-icon"></i>
              <input 
                type="email" 
                id="input-email" 
                placeholder="ten.ban@congty.vn" 
                required 
              />
            </div>
          </div>

          <!-- Mật khẩu -->
          <div class="input-group">
            <div class="label-row">
              <label class="input-label">Mật khẩu</label>
              <a href="#" class="forgot-link" onclick="alert('Vui lòng liên hệ IT/Admin để lấy lại mật khẩu!'); return false;">Quên mật khẩu?</a>
            </div>
            <div class="input-wrapper">
              <i class="fa-solid fa-lock input-icon"></i>
              <input 
                type="password" 
                id="input-password" 
                placeholder="••••••••" 
                required 
              />
              <button type="button" id="btn-toggle-pass" class="toggle-pass-btn">
                <i class="fa-regular fa-eye-slash" id="pass-eye-icon"></i>
              </button>
            </div>
          </div>

          <!-- Nút Đăng nhập -->
          <button type="submit" id="btn-submit" class="btn-submit">Đăng nhập</button>
        </form>
      </div>
    </div>
  </div>

  <script src="js/script.js"></script>
</body>
</html>
