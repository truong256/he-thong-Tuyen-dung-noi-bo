spring.application.name=auth-service
server.port=8080

# Database PostgreSQL configuration
spring.datasource.url=jdbc:postgresql://localhost:5432/recruitment_db
spring.datasource.username=postgres
spring.datasource.password=YOUR_POSTGRES_PASSWORD_HERE
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# Flyway configuration
spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=0
spring.flyway.locations=classpath:db/migration

# JWT Security Config (Placeholders)
jwt.secret=YOUR_HEX_OR_BASE64_SECRET_KEY_AT_LEAST_256_BITS_HERE
jwt.expiration-ms=3600000
jwt.refresh-token-expiration-ms=604800000
jwt.password-reset-expiration-ms=1800000

# CORS Configuration
app.cors.allowed-origins=http://localhost:5173,http://localhost:3000

# SMTP Mail Configuration (Used when running with SPRING_PROFILES_ACTIVE=dev,smtp)
app.frontend-url=http://localhost:5173
spring.mail.host=sandbox.smtp.mailtrap.io
spring.mail.port=2525
spring.mail.username=YOUR_MAILTRAP_USERNAME_HERE
spring.mail.password=YOUR_MAILTRAP_PASSWORD_HERE
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.from=noreply@company.test
spring.mail.properties.mail.smtp.timeout=10000

