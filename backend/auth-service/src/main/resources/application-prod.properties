# Explicit PostgreSQL production profile. No development database or secret fallbacks.
server.port=${PORT:${SERVER_PORT:8080}}
server.forward-headers-strategy=framework
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.hikari.connection-timeout=10000
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=false
spring.flyway.validate-on-migrate=true
spring.flyway.clean-disabled=true
spring.flyway.out-of-order=false
jwt.secret=${JWT_SECRET}
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS}
app.frontend-url=${APP_FRONTEND_URL}
app.local-seed-enabled=false
app.demo-seed.enabled=${DEMO_SEED_ENABLED:false}
app.upload.avatar-dir=${APP_UPLOAD_AVATAR_DIR:/data/uploads/avatars}
app.upload.company-dir=${APP_UPLOAD_COMPANY_DIR:/data/uploads/company}
logging.level.org.hibernate.SQL=WARN
