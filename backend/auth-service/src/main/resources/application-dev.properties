spring.application.name=auth-service-dev
server.port=${SERVER_PORT:8080}

# In-memory/file H2 database with PostgreSQL compatibility mode for instant local development without PostgreSQL installed
spring.datasource.url=jdbc:h2:file:./data/recruitment_db;MODE=PostgreSQL;DB_CLOSE_DELAY=-1;DATABASE_TO_LOWER=TRUE
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.H2Dialect

# JPA / Hibernate auto-generates schema
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false

# Flyway disabled for H2 local dev (Flyway scripts have Postgres-specific ON CONFLICT syntax)
spring.flyway.enabled=false

# JWT Security Config with fallback default for local dev
jwt.secret=${JWT_SECRET:DevSecretKeyForLocalDevelopmentPurposesOnlyNeedsToBe256BitsMinimumLengthSecureKey123}
jwt.expiration-ms=${JWT_ACCESS_EXPIRATION_MS:3600000}
jwt.refresh-token-expiration-ms=${JWT_REFRESH_EXPIRATION_MS:604800000}
jwt.password-reset-expiration-ms=${PASSWORD_RESET_EXPIRATION_MS:1800000}

# CORS Configuration
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:3000}

# ===================================================================
# SMTP Sandbox Configuration
# Active when running with SPRING_PROFILES_ACTIVE=dev,smtp
# ===================================================================
app.frontend-url=${APP_FRONTEND_URL:${FRONTEND_URL:http://localhost:5173}}
spring.mail.host=${SMTP_HOST:smtp.gmail.com}
spring.mail.port=${SMTP_PORT:587}
spring.mail.username=${SMTP_USERNAME:${MAIL_USERNAME:}}
spring.mail.password=${SMTP_PASSWORD:${MAIL_PASSWORD:}}
spring.mail.properties.mail.smtp.auth=${SMTP_AUTH:true}
spring.mail.properties.mail.smtp.starttls.enable=${SMTP_STARTTLS:true}
spring.mail.from=${MAIL_FROM:${SMTP_FROM:${spring.mail.username:noreply@company.test}}}
spring.mail.properties.mail.smtp.timeout=${SMTP_TIMEOUT:10000}

logging.level.org.springframework.security=WARN
logging.level.com.example.auth_service=INFO
