# ===================================================================
# Development Profile Configuration
# ===================================================================
# By default, profile 'dev' uses DevMailService (in-memory simulation).
# To enable real delivery to an SMTP Sandbox (e.g. Mailtrap), run with:
#   SPRING_PROFILES_ACTIVE=dev,smtp
#
# Environment variables for SMTP Sandbox (Mailtrap Email Testing):
#   SMTP_HOST, SMTP_PORT, SMTP_USERNAME, SMTP_PASSWORD, SMTP_AUTH,
#   SMTP_STARTTLS, SMTP_FROM, FRONTEND_URL
# ===================================================================

app.frontend-url=${FRONTEND_URL:http://localhost:5173}

spring.mail.host=${SMTP_HOST:sandbox.smtp.mailtrap.io}
spring.mail.port=${SMTP_PORT:2525}
spring.mail.username=${SMTP_USERNAME:}
spring.mail.password=${SMTP_PASSWORD:}
spring.mail.properties.mail.smtp.auth=${SMTP_AUTH:true}
spring.mail.properties.mail.smtp.starttls.enable=${SMTP_STARTTLS:true}
spring.mail.from=${SMTP_FROM:noreply@company.test}
spring.mail.properties.mail.smtp.timeout=${SMTP_TIMEOUT:10000}
