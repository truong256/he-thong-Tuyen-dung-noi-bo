spring.application.name=auth-service
server.port=${SERVER_PORT:8080}

# Database PostgreSQL configuration
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/recruitment_db}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA/Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# JWT Config
jwt.secret=${JWT_SECRET:mySecretKey12345678901234567890123456789012}
jwt.expiration-ms=${JWT_EXPIRATION_MS:3600000}
jwt.refresh-token-expiration-ms=${JWT_REFRESH_EXPIRATION_MS:604800000}