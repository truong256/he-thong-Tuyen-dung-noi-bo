spring.application.name=auth-service
server.port=${SERVER_PORT:8080}
spring.profiles.active=${SPRING_PROFILES_ACTIVE:dev}

# Database PostgreSQL configuration
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/recruitment_db}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# Flyway configuration
spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=0
spring.flyway.locations=classpath:db/migration

# JWT Security Config
jwt.secret=${JWT_SECRET:DevSecretKeyForLocalDevelopmentPurposesOnlyNeedsToBe256BitsMinimumLengthSecureKey123}
jwt.expiration-ms=${JWT_ACCESS_EXPIRATION_MS:3600000}
jwt.refresh-token-expiration-ms=${JWT_REFRESH_EXPIRATION_MS:604800000}
jwt.password-reset-expiration-ms=${PASSWORD_RESET_EXPIRATION_MS:1800000}

# CORS Configuration
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:3000}

# SMTP Mail Configuration (Used by SmtpMailService in production/default profile)
# For real delivery with dev, explicitly use SPRING_PROFILES_ACTIVE=dev,smtp.
app.frontend-url=${FRONTEND_URL:http://localhost:5173}
spring.mail.host=${SMTP_HOST:localhost}
spring.mail.port=${SMTP_PORT:587}
spring.mail.username=${SMTP_USERNAME:}
spring.mail.password=${SMTP_PASSWORD:}
spring.mail.properties.mail.smtp.auth=${SMTP_AUTH:false}
spring.mail.properties.mail.smtp.starttls.enable=${SMTP_STARTTLS:true}
spring.mail.from=${SMTP_FROM:noreply@recruitment-system.com}
spring.mail.properties.mail.smtp.timeout=${SMTP_TIMEOUT:10000}

logging.level.org.springframework.security=WARN
logging.level.com.example.auth_service.security=INFO
