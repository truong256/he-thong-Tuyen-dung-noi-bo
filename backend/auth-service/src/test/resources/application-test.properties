spring.application.name=auth-service-test
server.port=8080

spring.datasource.url=jdbc:h2:mem:rbac;MODE=PostgreSQL;DB_CLOSE_DELAY=-1
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.H2Dialect

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
# Existing V2 uses PostgreSQL ON CONFLICT (name), which H2 does not support.
# The new V5 migration is exercised separately by RbacMigrationTest.
spring.flyway.enabled=false

jwt.secret=TestSecretKeyForTestingPurposesOnlyNeedsToBe256BitsMinimumLengthSecureKeyTest
jwt.expiration-ms=3600000
jwt.refresh-token-expiration-ms=604800000
jwt.password-reset-expiration-ms=1800000

app.cors.allowed-origins=http://localhost:5173,http://localhost:3000

# Avatar Upload Configuration for Test
app.upload.avatar-dir=target/test-uploads/avatars
app.upload.thumbnail-size=150
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB
